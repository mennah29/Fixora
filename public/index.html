<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fixora — Industrial AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --panel: #f9fbfc;
      --sidebar: #f3f7f8;
      --text: #0b496b;
      --text2: #52798e;
      --border: #e1edf0;
      --brand: #0b496b;
      --active: #188a72;
      --mint: #d3f0cb;
      --ice: #cae7e8;
      --danger: #D92D20;
    }
    body.dark {
      --bg: #071923;
      --panel: #0d2430;
      --sidebar: #091c27;
      --text: #edf5f7;
      --text2: #8aa4b2;
      --border: #1b3a47;
      --brand: #188a72;
      --ice: #1b3a47;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

    /* Sidebar */
    .sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 14px 10px; flex-shrink: 0; transition: transform 0.2s; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.15rem; color: var(--brand); padding: 6px 10px 14px; }
    .new-chat-btn { background: var(--panel); color: var(--text); border: 1.5px solid var(--border); border-radius: 20px; padding: 9px 14px; font-weight: 600; font-size: 0.86rem; cursor: pointer; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; transition: all 0.15s; }
    .new-chat-btn:hover { background: var(--border); border-color: var(--active); }
    .history-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text2); padding: 6px 10px; }
    .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .history-item { padding: 8px 10px; border-radius: 8px; font-size: 0.84rem; cursor: pointer; color: var(--text); display: flex; justify-content: space-between; align-items: center; }
    .history-item:hover, .history-item.active { background: var(--border); font-weight: 600; color: var(--brand); }
    .sidebar-footer { border-top: 1px solid var(--border); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
    .select-box { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 0.8rem; outline: none; }

    /* Main Area */
    .main { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; }
    .header { height: 50px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
    .chat-container { flex: 1; overflow-y: auto; padding: 20px 24px 100px; display: flex; flex-direction: column; align-items: center; }
    .chat-inner { width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 20px; }

    /* Hero Empty State */
    .hero { text-align: center; margin: 40px auto 20px; max-width: 650px; display: flex; flex-direction: column; align-items: center; }
    .hero h1 { font-size: 2rem; font-weight: 800; margin: 12px 0 6px; letter-spacing: -0.5px; }
    .hero p { color: var(--text2); font-size: 0.9rem; margin-bottom: 24px; }
    .badge { background: var(--panel); border: 1px solid var(--ice); color: var(--brand); padding: 4px 10px; border-radius: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
    .card-btn { background: var(--brand); color: #ffffff; border: none; border-radius: 12px; padding: 14px 16px; text-align: left; cursor: pointer; transition: all 0.15s; }
    .card-btn:hover { background: var(--active); transform: translateY(-1px); }
    .card-btn strong { display: block; font-size: 0.88rem; margin-bottom: 3px; }
    .card-btn span { font-size: 0.76rem; opacity: 0.85; }

    /* Message Bubbles */
    .msg-user { align-self: flex-end; background: var(--panel); border: 1.5px solid var(--ice); color: var(--brand); padding: 10px 18px; border-radius: 18px 18px 4px 18px; max-width: 80%; font-size: 0.92rem; font-weight: 500; }
    .msg-bot { align-self: flex-start; width: 100%; display: flex; flex-direction: column; gap: 10px; font-size: 0.93rem; line-height: 1.6; }
    .proc-card { background: var(--panel); border: 1.5px solid var(--ice); border-radius: 12px; overflow: hidden; margin-top: 6px; }
    .proc-header { background: rgba(11, 73, 107, 0.05); padding: 10px 16px; font-weight: 700; font-size: 0.8rem; color: var(--brand); letter-spacing: 0.5px; }
    .proc-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
    .proc-step { display: flex; align-items: flex-start; gap: 10px; font-size: 0.88rem; }
    .step-num { background: rgba(11, 73, 107, 0.08); color: var(--brand); font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; font-weight: 700; padding: 2px 7px; border-radius: 6px; flex-shrink: 0; }
    .proc-footer { background: rgba(11, 73, 107, 0.03); padding: 8px 16px; font-family: 'IBM Plex Mono', monospace; font-size: 0.74rem; color: var(--text2); display: flex; justify-content: space-between; }
    .danger-banner { background: #fee4e2; border-left: 4px solid var(--danger); color: #7a1510; padding: 10px 14px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; }

    /* Input Pill */
    .input-wrapper { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 100%; max-width: 760px; padding: 0 20px; }
    .input-box { background: var(--bg); border: 1.5px solid var(--border); border-radius: 28px; display: flex; align-items: center; padding: 6px 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.06); }
    .input-box input { flex: 1; border: none; outline: none; background: transparent; color: var(--text); font-size: 0.92rem; padding: 6px 10px; }
    .send-btn { width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--brand); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .send-btn:hover { background: var(--active); }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 100 100"><polygon points="50,10 85,30 85,70 50,90 15,70 15,30" fill="none" stroke="#0b496b" stroke-width="8"/><circle cx="50" cy="50" r="18" fill="none" stroke="#188a72" stroke-width="8"/><circle cx="50" cy="50" r="6" fill="#188a72"/></svg>
      Fixora
    </div>
    <button class="new-chat-btn" onclick="startNewChat()">✚ New chat</button>
    <div class="history-label">Recent Sessions</div>
    <div class="history-list" id="historyList"></div>
    <div class="sidebar-footer">
      <select class="select-box" id="deviceSelect">
        <option value="Siemens Servo 900 Ventilator">Siemens Servo 900 Ventilator</option>
        <option value="Siemens Mobilett Plus HP">Siemens Mobilett Plus HP</option>
        <option value="Siemens Powermobil">Siemens Powermobil</option>
        <option value="Compressor X200">Compressor X200</option>
        <option value="All Devices">All Devices</option>
      </select>
      <button class="new-chat-btn" onclick="toggleTheme()" style="justify-content:center; margin-bottom:0;">🌓 Toggle Theme</button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main">
    <div class="header">
      <span style="font-weight:700; font-size:0.9rem;" id="headerTitle">Fixora Diagnostic Workspace</span>
      <span class="badge">● Ready</span>
    </div>
    <div class="chat-container">
      <div class="chat-inner" id="chatInner">
        <div class="hero" id="heroArea">
          <svg width="48" height="48" viewBox="0 0 100 100"><polygon points="50,10 85,30 85,70 50,90 15,70 15,30" fill="none" stroke="#0b496b" stroke-width="8"/><circle cx="50" cy="50" r="18" fill="none" stroke="#188a72" stroke-width="8"/><circle cx="50" cy="50" r="6" fill="#188a72"/></svg>
          <h1>What's on your mind today?</h1>
          <p>Grounded technical assistant for <span class="badge" id="selectedBadge">Siemens Servo 900 Ventilator</span></p>
          <div class="grid">
            <button class="card-btn" onclick="sendPrompt('Error Code 37 troubleshooting')"><strong>⚡ Error Code 37 Troubleshooting</strong><span>Flow meter range error & connectors</span></button>
            <button class="card-btn" onclick="sendPrompt('Alarm 29 battery replacement')"><strong>🔋 Alarm 29 Battery Replacement</strong><span>Lithium battery service on PC1772 board</span></button>
            <button class="card-btn" onclick="sendPrompt('High voltage power isolation')"><strong>⚠️ High Voltage Power Isolation</strong><span>Lockout/tagout (LOTO) protocols</span></button>
            <button class="card-btn" onclick="sendPrompt('Cooling system specifications')"><strong>❄️ Cooling System Specs</strong><span>Flow rates and chiller options</span></button>
          </div>
        </div>
      </div>
    </div>
    <div class="input-wrapper">
      <div class="input-box">
        <input type="text" id="userInput" placeholder="Ask anything about faults, codes, procedures..." onkeydown="if(event.key==='Enter') submitQuery()"/>
        <button class="send-btn" onclick="submitQuery()">↑</button>
      </div>
    </div>
  </div>

  <script>
    let sessions = [{ id: '1', title: 'New Diagnostic Session', messages: [] }];
    let currentId = '1';

    function renderHistory() {
      const el = document.getElementById('historyList');
      el.innerHTML = sessions.map(s => `
        <div class="history-item ${s.id === currentId ? 'active' : ''}" onclick="switchSession('${s.id}')">
          <span>${s.title}</span>
        </div>
      `).join('');
    }

    function switchSession(id) {
      currentId = id;
      renderHistory();
      renderChat();
    }

    function startNewChat() {
      const id = String(Date.now());
      sessions.unshift({ id: id, title: 'New Diagnostic Session', messages: [] });
      currentId = id;
      renderHistory();
      renderChat();
    }

    function renderChat() {
      const s = sessions.find(x => x.id === currentId);
      const inner = document.getElementById('chatInner');
      if (!s || s.messages.length === 0) {
        inner.innerHTML = `
          <div class="hero" id="heroArea">
            <svg width="48" height="48" viewBox="0 0 100 100"><polygon points="50,10 85,30 85,70 50,90 15,70 15,30" fill="none" stroke="#0b496b" stroke-width="8"/><circle cx="50" cy="50" r="18" fill="none" stroke="#188a72" stroke-width="8"/><circle cx="50" cy="50" r="6" fill="#188a72"/></svg>
            <h1>What's on your mind today?</h1>
            <p>Grounded technical assistant for <span class="badge">${document.getElementById('deviceSelect').value}</span></p>
            <div class="grid">
              <button class="card-btn" onclick="sendPrompt('Error Code 37 troubleshooting')"><strong>⚡ Error Code 37 Troubleshooting</strong><span>Flow meter range error & connectors</span></button>
              <button class="card-btn" onclick="sendPrompt('Alarm 29 battery replacement')"><strong>🔋 Alarm 29 Battery Replacement</strong><span>Lithium battery service on PC1772 board</span></button>
              <button class="card-btn" onclick="sendPrompt('High voltage power isolation')"><strong>⚠️ High Voltage Power Isolation</strong><span>Lockout/tagout (LOTO) protocols</span></button>
              <button class="card-btn" onclick="sendPrompt('Cooling system specifications')"><strong>❄️ Cooling System Specs</strong><span>Flow rates and chiller options</span></button>
            </div>
          </div>
        `;
        return;
      }
      inner.innerHTML = s.messages.map(m => {
        if (m.role === 'user') return `<div class="msg-user">${m.text}</div>`;
        let cardHtml = '';
        if (m.data && m.data.checklist && m.data.checklist.length > 0) {
          cardHtml = `
            <div class="proc-card">
              <div class="proc-header">⚙ RECOMMENDED MAINTENANCE PROCEDURE</div>
              <div class="proc-body">
                ${m.data.checklist.map((st, i) => `
                  <div class="proc-step">
                    <span class="step-num">${String(i+1).padStart(2, '0')}</span>
                    <span>${st}</span>
                  </div>
                `).join('')}
              </div>
              <div class="proc-footer">
                <span>📄 ${m.data.source_citation?.manual || 'Service Manual'} · p.${m.data.source_citation?.page || '1'}</span>
                <span>${m.data.checklist.length} STEPS</span>
              </div>
            </div>
          `;
        }
        let danger = (m.data?.has_high_priority_safety && m.data?.safety_body) 
          ? `<div class="danger-banner">⚠️ ${m.data.safety_body}</div>` : '';
        return `
          <div class="msg-bot">
            ${danger}
            <div><strong>Fixora:</strong> ${m.data?.fault_meaning || m.text}</div>
            ${cardHtml}
          </div>
        `;
      }).join('');
    }

    async function submitQuery() {
      const input = document.getElementById('userInput');
      const q = input.value.trim();
      if (!q) return;
      input.value = '';
      sendPrompt(q);
    }

    async function sendPrompt(q) {
      const s = sessions.find(x => x.id === currentId);
      if (s.messages.length === 0) s.title = q.slice(0, 24);
      s.messages.push({ role: 'user', text: q });
      renderHistory();
      renderChat();

      const device = document.getElementById('deviceSelect').value;
      try {
        const res = await fetch('/api/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: q, device_name: device, top_k: 5 })
        });
        const data = await res.json();
        s.messages.push({ role: 'bot', text: data.answer || data.fault_meaning, data: data });
      } catch (err) {
        s.messages.push({ role: 'bot', text: 'Error contacting diagnostic engine.', data: {} });
      }
      renderChat();
    }

    function toggleTheme() {
      document.body.classList.toggle('dark');
    }

    document.getElementById('deviceSelect').addEventListener('change', (e) => {
      const b = document.getElementById('selectedBadge');
      if (b) b.innerText = e.target.value;
    });

    renderHistory();
  </script>
</body>
</html>
